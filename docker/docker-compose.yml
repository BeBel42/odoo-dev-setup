# project name is set by ./o, one per worktree
name: ${COMPOSE_PROJECT_NAME:-odoo-dev_odoo}

networks:
  default:
  # shared with the caddy proxy, see docker/proxy/
  proxy:
    external: true
    name: odoo-proxy-network

services:
  db:
    hostname: db
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_DB: odoo
    restart: on-failure:10
    healthcheck:
      test: pg_isready
      interval: 5s
      retries: 5
      start_period: 1s
      timeout: 5s
    volumes:
      - ./volumes/db:/var/lib/postgresql/
      # only executed when ./volumes/db is empty
      - ./initdb.d:/docker-entrypoint-initdb.d:ro

  odoo:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.odoo
    depends_on:
      db:
        condition: service_healthy
    # hostname depends on directory
    # (to not conflict with multiple instance from different workspaces)
    hostname: ${INSTANCE_NAME:-odoo}
    networks:
      default:
      proxy:
        # caddy routes <instance>.localhost here
        aliases:
          - ${INSTANCE_NAME:-odoo}
    volumes:
      - ../enterprise:/app/enterprise
      - ../community:/app/community
      - ../tutorials:/app/tutorials
      - ../upgrade:/app/upgrade
      - ../upgrade-util:/app/upgrade-util
      - ../venv:/app/venv
      - ../.odoorc:/app/.odoorc
      - ../lib/custom-odoo-bin:/app/custom-odoo-bin
      # where odoo stores its session data
      - ./volumes/.odoo-share:/root/.local/share/Odoo/
      - ./volumes/screenshots/:/tmp/odoo_tests/
    # environment:
    #   ODOO_TEST_FAILURE_RETRIES: 1

  setup:
    build:
      context: .
      dockerfile: ./Dockerfile.setup
    volumes:
      - ../enterprise:/app/enterprise
      - ../community:/app/community
      - ../tutorials:/app/tutorials
      - ../upgrade:/app/upgrade
      - ../upgrade-util:/app/upgrade-util
      - ../documentation:/app/documentation
      - ../venv:/app/venv
      - ../.agents:/app/.agents
      - ~/.ssh:/root/.ssh:ro
